[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma-stt"
version = "1.0.0"
description = "Gemma Long Test App — Bangla & English real-time transcription with Gemma 4"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "cryptography>=44.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_stt"]
