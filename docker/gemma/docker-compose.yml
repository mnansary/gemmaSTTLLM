name: gemma-llm-stt

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemma-llm-stt-vllm:local
    container_name: gemma-llm-stt-vllm
    networks:
      - default

    command: >
      cyankiwi/gemma-4-E4B-it-AWQ-INT4
      --served-model-name gemma4
      --host 0.0.0.0
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.50}
      --enable-chunked-prefill
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --limit-mm-per-prompt '{"image":5,"audio":5,"video":2}'
      --max-num-seqs 16

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    ports:
      - "${HOST_PORT:-5000}:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s

    environment:
      - CUDA_VISIBLE_DEVICES=${GPU_DEVICE:-0}

networks:
  default:
    name: gemma-llm-stt-net
